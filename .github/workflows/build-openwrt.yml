name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: true
        default: 'false'
        type: choice
        options:
        - "true"
        - "false"
      version:
        description: 'Custom OpenWrt REPOSITORY branch'
        required: true
        default: 'openwrt-24.10'
        type: string
        
env:
  REPO_URL: https://github.com/neuro-dev/openwrt.git
  REPO_BRANCH: ${{ github.event.inputs.version }}
  BUILD_ROOT: ${{ github.workspace }}/openwrt
  DEPENDENCIES: ${{ github.workspace }}/dependencies-ubuntu.txt
  CUSTOM_FEEDS_SH: ${{ github.workspace }}/custom-feeds.sh
  CUSTOM_PACKAGES_SH: ${{ github.workspace }}/custom-packages.sh
  CUSTOM_CONFIG_SH: ${{ github.workspace }}/custom-config.sh
  CUSTOM_CONFIG_FILE: ${{ github.workspace }}/custom-config
  PREBUILD_MISC_SH: ${{ github.workspace }}/prebuild-misc.sh
  SDK_PATH: unknown
  DATE: unknown
  FIRMWARE_COMMIT_URL: unknown
  BUILDER_COMMIT_URL: unknown
  TZ: Europe/Moscow
  DEVICE_NAME: unknown
  RELEASE_NAME: unknown
  FIRMWARE: unknown

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get -qq update && sudo apt-get -qq upgrade
        sudo apt-get -qq install git ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext git gperf haveged help2man intltool libelf-dev libglib2.0-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev gcc g++ make golang-go golang-1.21 libpam0g-dev libsnmp-dev snmp libev-dev libpcre3-dev libwrap0-dev libsensors-dev libcap-dev
        sudo apt-get -qq autoremove --purge
        sudo apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Maximize build disk space
      uses: easimon/maximize-build-space@master
      with:
        remove-dotnet: true
        remove-android: true
        remove-haskell: true
        remove-codeql: true
        remove-docker-images: true

    - name: Checkout
      uses: actions/checkout@main

    - name: Download the sources
      id: sourcedownload
      run: |
        git clone --branch $REPO_BRANCH $REPO_URL
        echo "DATE=$(date "+%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Cache OpenWrt build
      uses: actions/cache@v4
      with:
        path: |
          $BUILD_ROOT/
        key: openwrt-24.10-${{ 'riscv64' }}-ccache
        restore-keys: |
          openwrt-24.10-${{ 'riscv64' }}-ccache

    - name: Load custom
      run: |
        chmod +x *.sh
        $CUSTOM_FEEDS_SH
        $BUILD_ROOT/scripts/feeds update -a && $BUILD_ROOT/scripts/feeds install -a
        $BUILD_ROOT/scripts/feeds uninstall tailscale
        $CUSTOM_PACKAGES_SH
        $CUSTOM_CONFIG_SH
        $PREBUILD_MISC_SH
        echo "BUILDER_COMMIT_URL=$(git config --get remote.origin.url | sed 's/\.git$//' | sed 's/git@github.com:/https:\/\/github.com\//')/commit/$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Start SSH via tmate
      uses: rdp-studio/ssh2actions@main
      if: github.event.inputs.ssh == 'true'

    - name: Build the firmware image
      id: compile
      run: |
        cd $BUILD_ROOT && echo "$(($(nproc)+1)) thread compile"
        IGNORE_ERRORS=m make -j$(($(nproc)+1)) defconfig download clean world || IGNORE_ERRORS=m make -j1 defconfig download clean world V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "RELEASE_NAME=$(git describe --tags --always --long)" >> $GITHUB_ENV
        echo "FIRMWARE_COMMIT_URL=$(git config --get remote.origin.url | sed 's/\.git$//' | sed 's/git@github.com:/https:\/\/github.com\//')/commit/$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Check space usage
      run: df -hT

    - name: Organize SDK files
      id: organize_sdk
      run: |
        cd $BUILD_ROOT/
        cd ../
        echo $(du -h openwrt/ | sort -hr | head -10)
        tar -zcf openwrt_sdk_${{ env.RELEASE_NAME }}.tar.gz openwrt/
        echo $(ls -lh openwrt_sdk_${{ env.RELEASE_NAME }}.tar.gz | awk '{print $5}')
        echo "SDK_PATH=$(pwd)" >> $GITHUB_ENV

    - name: Upload artifact
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-sdk
        path: $SDK_PATH/openwrt_sdk_${{ env.RELEASE_NAME }}.tar.gz
        
        retention-days: 30

    - name: Organize files
      id: organize
      run: |
        cd $BUILD_ROOT/bin/packages
        tar -zcf Packages.tar.gz ./*
        cp Packages.tar.gz $BUILD_ROOT/bin/targets/*/*
        cd $BUILD_ROOT/bin/targets/*/* && rm -rf packages
        {
            echo "# Build #${{ github.run_number }} - ${{ env.DEVICE_NAME }}"
            echo "**Date:** $(date)"
            echo "**FIRMWARE Commit:** $FIRMWARE_COMMIT_URL"
            echo "**BUILDER Commit:** $BUILDER_COMMIT_URL"
            echo "**OpenWrt Branch:** ${{ github.event.inputs.version }}"
            echo "**Device:** $DEVICE_NAME"

            echo "**Runner:** ${{ runner.os }} (${{ runner.arch }})"
            echo "# Artifacts"
            echo "**BIN**: ${{ steps.artifact-bin.outputs.artifact-url }}"
          } > ${{ env.BUILD_ROOT }}/BUILD_INFO.md
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      id: artifact-firmware
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success'
      with:
        name: firmware_${{ env.DEVICE_NAME }}_${{ env.RELEASE_NAME }}
        path: ${{ env.FIRMWARE }}

    - name: Generate stable Release Tag
      id: stabletag
      if: steps.sourcedownload.outputs.status == 'success'
      run: |
        echo "release_tag=$(cd $BUILD_ROOT && git describe --tags --abbrev=0 --exact-match)-$(date +%Y%m%d)" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload stable firmware to Release
      uses: softprops/action-gh-release@master
      if: steps.stabletag.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.stabletag.outputs.release_tag }}
        name: "${{ env.RELEASE_NAME }} - ${{ env.DEVICE_NAME }}"
        files: ${{ env.FIRMWARE }}/*
        body_path: ${{ env.BUILD_ROOT }}/BUILD_INFO.md
        draft: false
        make_latest: true


    - name: Delete workflow runs
      if: always()
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 30
        keep_minimum_runs: 5

    - name: Remove old Releases
      if: always()
      uses: dev-drprasad/delete-older-releases@master
      with:
        keep_latest: 5
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}